# Payment Service — local K8s (port 8088, needs Kafka)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ecommerce
  labels: { app: payment-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
    spec:
      containers:
        - name: payment-service
          image: localhost:5000/ecommerce/payment-service:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8088 }]
          env:
            - { name: QUARKUS_DATASOURCE_JDBC_URL, value: "jdbc:postgresql://postgres:5432/payment_db" }
            - { name: QUARKUS_DATASOURCE_USERNAME, valueFrom: { secretKeyRef: { name: ecommerce-db-secret, key: db-username } } }
            - { name: QUARKUS_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: ecommerce-db-secret, key: db-password } } }
            - { name: QUARKUS_OIDC_AUTH_SERVER_URL, valueFrom: { configMapKeyRef: { name: ecommerce-config, key: KEYCLOAK_OIDC_URL } } }
            - { name: KAFKA_BOOTSTRAP_SERVERS, valueFrom: { configMapKeyRef: { name: ecommerce-config, key: KAFKA_BOOTSTRAP_SERVERS } } }
            - { name: QUARKUS_HTTP_PORT, value: "8088" }
          resources:
            requests: { cpu: "150m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: payment-service, namespace: ecommerce }
spec:
  selector: { app: payment-service }
  ports: [{ port: 8088, targetPort: 8088 }]
