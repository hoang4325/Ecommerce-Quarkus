---
# ═══════════════════════════════════════════════════════════════════════════════
# Ingress — Routes external traffic to frontend + api-gateway
# Requires: nginx-ingress-controller installed in the cluster
# TODO: Update host, TLS secret, and cert-manager annotations if needed
#
# Install nginx-ingress: 
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.0/deploy/static/provider/cloud/deploy.yaml
#
# Install cert-manager (optional, for auto HTTPS):
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.0/cert-manager.yaml
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # TODO: Uncomment below for HTTPS with cert-manager
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  # TODO: Configure TLS if using HTTPS
  # tls:
  #   - hosts:
  #       - ecommerce.example.com  # TODO: update your domain
  #     secretName: ecommerce-tls
  rules:
    # TODO: Update to your actual domain
    - host: ecommerce.example.com   # TODO
      http:
        paths:
          # API traffic → api-gateway
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 8083
          # All other traffic → frontend SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
