# Product Service — local K8s (port 8083)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecommerce
  labels: { app: product-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: product-service }
  template:
    metadata:
      labels: { app: product-service }
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z keycloak 8080; do sleep 5; done"]
      containers:
        - name: product-service
          image: ecommerce/product-service:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 8083 }]
          env:
            - { name: QUARKUS_DATASOURCE_JDBC_URL, value: "jdbc:postgresql://postgres:5432/product_db" }
            - { name: QUARKUS_DATASOURCE_USERNAME, valueFrom: { secretKeyRef: { name: ecommerce-db-secret, key: db-username } } }
            - { name: QUARKUS_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: ecommerce-db-secret, key: db-password } } }
            - { name: QUARKUS_OIDC_AUTH_SERVER_URL, valueFrom: { configMapKeyRef: { name: ecommerce-config, key: KEYCLOAK_OIDC_URL } } }
            - { name: QUARKUS_HTTP_PORT, value: "8083" }
          resources:
            requests: { cpu: "150m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: product-service, namespace: ecommerce }
spec:
  selector: { app: product-service }
  ports: [{ port: 8083, targetPort: 8083 }]
