# User Service — local K8s (port 8090)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ecommerce
  labels: { app: user-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      containers:
        - name: user-service
          image: localhost:5000/ecommerce/user-service:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8090 }]
          env:
            - { name: QUARKUS_DATASOURCE_JDBC_URL, value: "jdbc:postgresql://postgres:5432/user_db" }
            - { name: QUARKUS_DATASOURCE_USERNAME, valueFrom: { secretKeyRef: { name: ecommerce-db-secret, key: db-username } } }
            - { name: QUARKUS_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: ecommerce-db-secret, key: db-password } } }
            - { name: QUARKUS_OIDC_AUTH_SERVER_URL, valueFrom: { configMapKeyRef: { name: ecommerce-config, key: KEYCLOAK_OIDC_URL } } }
            - { name: QUARKUS_HTTP_PORT, value: "8090" }
          resources:
            requests: { cpu: "150m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: user-service, namespace: ecommerce }
spec:
  selector: { app: user-service }
  ports: [{ port: 8090, targetPort: 8090 }]
