# =============================================================================
# User Service — port 8090
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ecommerce
  labels:
    app: user-service
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z keycloak 8080; do echo 'Waiting for keycloak...'; sleep 5; done"]
      containers:
        - name: user-service
          image: IMAGE_REGISTRY/user-service:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: "jdbc:postgresql://postgres:5432/user_db"
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ecommerce-db-secret
                  key: db-username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-db-secret
                  key: db-password
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: KEYCLOAK_OIDC_URL
            - name: QUARKUS_HTTP_PORT
              value: "8090"
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      imagePullSecrets:
        - name: ghcr-pull-secret
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ecommerce
  labels:
    app: user-service
spec:
  selector:
    app: user-service
  ports:
    - port: 8090
      targetPort: 8090
