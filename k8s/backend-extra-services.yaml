---
# ═══════════════════════════════════════════════════════════════════════════════
# Auth Service — Deployment + Service
# Port: 8082
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ecommerce
  labels:
    app: auth-service
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: auth-service
        app.kubernetes.io/part-of: ecommerce
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: auth-service
          image: IMAGE_REGISTRY/auth-service:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: QUARKUS_HTTP_PORT
              value: "8082"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 8082
      targetPort: 8082
      name: http

---
# ═══════════════════════════════════════════════════════════════════════════════
# Inventory Service — Deployment + Service
# Port: 8088 | Database: inventory_db | Kafka
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ecommerce
  labels:
    app: inventory-service
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: inventory-service
        app.kubernetes.io/part-of: ecommerce
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: inventory-service
          image: IMAGE_REGISTRY/inventory-service:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
              name: http
          env:
            - name: QUARKUS_HTTP_PORT
              value: "8088"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_PORT
            - name: DB_NAME_INVENTORY
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_NAME_INVENTORY
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DB_USERNAME
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: KAFKA_BOOTSTRAP_SERVERS
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8088
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: inventory-service
  ports:
    - port: 8088
      targetPort: 8088

