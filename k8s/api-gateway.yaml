# API Gateway — local K8s (port 8086)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce
  labels: { app: api-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z keycloak 8080; do sleep 5; done"]
      containers:
        - name: api-gateway
          image: ecommerce/api-gateway:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 8086 }]
          envFrom:
            - configMapRef:
                name: ecommerce-config
          env:
            - { name: QUARKUS_HTTP_PORT, value: "8086" }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: ecommerce }
spec:
  type: NodePort
  selector: { app: api-gateway }
  ports:
    - port: 8086
      targetPort: 8086
      nodePort: 30086
