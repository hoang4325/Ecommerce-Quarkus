---
# ═══════════════════════════════════════════════════════════════════════════════
# Secret — Sensitive credentials
# IMPORTANT: In production, use Sealed Secrets, Vault, or External Secrets Operator
# Values below are base64-encoded placeholders — REPLACE before deploying
#
# To encode a value: echo -n "your-value" | base64
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce   # TODO
  labels:
    app.kubernetes.io/part-of: ecommerce
type: Opaque
data:
  # ── Database credentials ────────────────────────────────────────────────────
  # TODO: Replace with base64 of your actual credentials
  # echo -n "admin" | base64  →  YWRtaW4=
  DB_USERNAME: YWRtaW4=          # TODO: admin
  DB_PASSWORD: YWRtaW4xMjM=     # TODO: admin123 — CHANGE THIS!

  # ── Keycloak admin ─────────────────────────────────────────────────────────
  KEYCLOAK_ADMIN: YWRtaW4=       # TODO: admin
  KEYCLOAK_ADMIN_PASSWORD: YWRtaW4xMjM=  # TODO: admin123 — CHANGE THIS!

  # ── JWT signing ────────────────────────────────────────────────────────────
  # TODO: Generate a strong secret: openssl rand -base64 64 | base64
  JWT_SECRET: VEVNUF9KV1RfU0VDUkVUX0NIQU5HRV9USElT  # TODO: CHANGE THIS!
