# =============================================================================
# Secrets — Store all sensitive credentials
# NOTE: In production use Sealed Secrets or External Secrets Operator.
#       These base64 values are: admin=YWRtaW4=  admin123=YWRtaW4xMjM=
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-db-secret
  namespace: ecommerce
type: Opaque
data:
  # echo -n "admin" | base64
  db-username: YWRtaW4=
  # echo -n "admin123" | base64
  db-password: YWRtaW4xMjM=
  # echo -n "admin" | base64
  keycloak-admin-username: YWRtaW4=
  # echo -n "admin123" | base64
  keycloak-admin-password: YWRtaW4xMjM=
