name: CI/CD Pipeline for E-Commerce Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ─── Global env ───────────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ecommerce

  JAVA_VERSION: '17'
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build & Test Backend (Quarkus)
  # ─────────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend (Quarkus)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            port: 8083
          - name: product-service
            port: 8085
          - name: cart-service
            port: 8086
          - name: order-service
            port: 8087
          - name: auth-service
            port: 8082
          - name: inventory-service
            port: 8088
          - name: payment-service
            port: 8089
          - name: notification-service
            port: 8090
          - name: user-service
            port: 8091

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test ${{ matrix.service.name }}
        run: |
          mvn package \
            -pl backend/${{ matrix.service.name }} -am \
            -DskipTests \
            --batch-mode --no-transfer-progress

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image — ${{ matrix.service.name }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/${{ matrix.service.name }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build & Test Frontend (React/Vite)
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend (React/Vite)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --frozen-lockfile

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (production)
        working-directory: frontend
        run: npm run build
        env:
          # TODO: Update this to your api-gateway public URL
          VITE_API_BASE_URL: /api

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image — frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy to Production (Docker Compose over SSH)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy via Docker Compose (SSH)
    runs-on: ubuntu-latest
    needs: [ build-backend, build-frontend ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: read

    environment:
      name: production
      url: http://${{ secrets.SSH_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Setup SSH key ─────────────────────────────────────────────────────────
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # ── Copy docker-compose.yml to server ─────────────────────────────────────
      - name: Upload docker-compose.yml to server
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            docker-compose.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/ecommerce/docker-compose.yml

      # ── Pull latest images & restart services ─────────────────────────────────
      - name: Deploy on server via SSH
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -e
            cd ~/ecommerce

            # Login to GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pull all latest images
            IMAGE_TAG=$IMAGE_TAG docker compose pull

            # Restart containers with zero-downtime rolling update
            IMAGE_TAG=$IMAGE_TAG docker compose up -d --remove-orphans

            # Prune old dangling images to save disk space
            docker image prune -f

            echo "✅ Deployment complete!"
          ENDSSH

      # ── Health check ─────────────────────────────────────────────────────────
      - name: Verify deployment (health check)
        run: |
          sleep 15
          echo "Checking frontend..."
          curl --fail --max-time 10 http://${{ secrets.SSH_HOST }}:3000 \
            && echo "✅ Frontend is up" \
            || echo "⚠️ Frontend health check failed (may still be starting)"

          echo "Checking API Gateway..."
          curl --fail --max-time 10 http://${{ secrets.SSH_HOST }}:8086/q/health \
            && echo "✅ API Gateway is up" \
            || echo "⚠️ API Gateway health check failed (may still be starting)"

      # ── Notify on failure ─────────────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above."
