name: CI Pipeline — E-Commerce Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build & Validate Backend (Quarkus)
  # ─────────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend — ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - product-service
          - cart-service
          - order-service
          - inventory-service
          - payment-service
          - notification-service
          - user-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build ${{ matrix.service }}
        run: |
          mvn package \
            -pl backend/${{ matrix.service }} -am \
            -DskipTests \
            --batch-mode --no-transfer-progress

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build & Validate Frontend (React/Vite)
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend (React/Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --frozen-lockfile

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (production)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

  # ─────────────────────────────────────────────────────────────────────────────
  # NOTE: Deployment is done locally via deploy-local.ps1
  # To deploy, run on your machine:
  #   .\deploy-local.ps1
  # ─────────────────────────────────────────────────────────────────────────────
