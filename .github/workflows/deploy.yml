name: CI/CD Pipeline for E-Commerce Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ─── Global env ───────────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ecommerce
  K8S_NAMESPACE: ecommerce
  JAVA_VERSION: '17'
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build & Test Backend (Quarkus)
  # ─────────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend (Quarkus)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            port: 8086
          - name: product-service
            port: 8083
          - name: cart-service
            port: 8084
          - name: order-service
            port: 8085
          - name: auth-service
            port: 8082
          - name: inventory-service
            port: 8087
          - name: payment-service
            port: 8088
          - name: notification-service
            port: 8089
          - name: user-service
            port: 8090

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test ${{ matrix.service.name }}
        run: |
          mvn package \
            -pl backend/${{ matrix.service.name }} -am \
            -DskipTests \
            --batch-mode --no-transfer-progress

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image — ${{ matrix.service.name }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/${{ matrix.service.name }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build & Test Frontend (React/Vite)
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend (React/Vite)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --frozen-lockfile

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (production)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image — frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy to Kubernetes
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest           # ← GitHub-hosted runner (no self-hosted needed)
    needs: [ build-backend, build-frontend ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: read

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Install kubectl ───────────────────────────────────────────────────────
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      # ── Validate KUBE_CONFIG secret is set ──────────────────────────────────
      # HOW TO SET THIS SECRET:
      # 1. On the machine that has access to your cluster, run:
      #      cat ~/.kube/config | base64 -w 0
      # 2. Copy the output
      # 3. Go to: GitHub repo → Settings → Secrets and variables → Actions
      # 4. Click "New repository secret"
      # 5. Name: KUBE_CONFIG  |  Value: (paste the base64 string)
      - name: Validate KUBE_CONFIG secret
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo ""
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║  ❌  KUBE_CONFIG secret is NOT set in GitHub!                ║"
            echo "╠══════════════════════════════════════════════════════════════╣"
            echo "║  HOW TO FIX:                                                 ║"
            echo "║  1. On your Kubernetes server, run:                          ║"
            echo "║     cat ~/.kube/config | base64 -w 0                         ║"
            echo "║  2. Go to: GitHub repo → Settings →                          ║"
            echo "║            Secrets and variables → Actions                   ║"
            echo "║  3. Add secret: KUBE_CONFIG = <the base64 string>            ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            echo ""
            exit 1
          fi
          echo "✅ KUBE_CONFIG secret is set."

      # ── Configure kubeconfig from GitHub Secret ───────────────────────────────
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          # Confirm the file was written and is non-empty
          if [ ! -s $HOME/.kube/config ]; then
            echo "❌ kubeconfig file is empty after decoding! Check your KUBE_CONFIG secret."
            exit 1
          fi
          echo "✅ kubeconfig written ($(wc -c < $HOME/.kube/config) bytes)"

      # ── Verify cluster connectivity ───────────────────────────────────────────
      - name: Verify cluster connectivity
        run: kubectl cluster-info --request-timeout=15s

      # ── Apply namespace first ─────────────────────────────────────────────────
      - name: Create namespace (idempotent)
        run: kubectl apply -f k8s/namespace.yaml

      # ── Create GHCR image pull secret ─────────────────────────────────────────
      - name: Create image pull secret for GHCR
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # ── Apply ConfigMaps & Secrets ────────────────────────────────────────────
      - name: Apply ConfigMaps & Secrets
        run: |
          kubectl apply -f k8s/secret.yaml    -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/configmap.yaml -n ${{ env.K8S_NAMESPACE }}

      # ── Apply infrastructure (Postgres, Kafka, Keycloak) ─────────────────────
      - name: Deploy infrastructure
        run: |
          kubectl apply -f k8s/postgres.yaml  -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/kafka.yaml     -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/keycloak.yaml  -n ${{ env.K8S_NAMESPACE }}

      # ── Substitute image tag & registry in all service manifests ─────────────
      - name: Inject image tag into manifests
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_REGISTRY: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
        run: |
          # Replace placeholders in all k8s YAML files
          find k8s/ -name "*.yaml" | xargs sed -i \
            -e "s|IMAGE_TAG|${IMAGE_TAG}|g" \
            -e "s|IMAGE_REGISTRY|${IMAGE_REGISTRY}|g"

      # ── Deploy all backend microservices ──────────────────────────────────────
      - name: Deploy microservices
        run: |
          kubectl apply -f k8s/auth-service.yaml         -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/product-service.yaml      -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/cart-service.yaml         -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/order-service.yaml        -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/inventory-service.yaml    -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/payment-service.yaml      -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/notification-service.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/user-service.yaml         -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/api-gateway.yaml          -n ${{ env.K8S_NAMESPACE }}

      # ── Deploy frontend ───────────────────────────────────────────────────────
      - name: Deploy frontend
        run: |
          kubectl apply -f k8s/frontend.yaml -n ${{ env.K8S_NAMESPACE }}

      # ── Wait for critical deployments to be ready ─────────────────────────────
      - name: Wait for rollouts
        run: |
          echo "⏳ Waiting for api-gateway..."
          kubectl rollout status deployment/api-gateway \
            -n ${{ env.K8S_NAMESPACE }} --timeout=120s

          echo "⏳ Waiting for frontend..."
          kubectl rollout status deployment/frontend \
            -n ${{ env.K8S_NAMESPACE }} --timeout=60s

      # ── Final status report ───────────────────────────────────────────────────
      - name: Verify running pods
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} \
            -l app.kubernetes.io/part-of=ecommerce

          echo "=== Services ==="
          kubectl get services -n ${{ env.K8S_NAMESPACE }}

          echo "=== Ingress ==="
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }}

      # ── Notify on failure ─────────────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Recent cluster events:"
          kubectl get events -n ${{ env.K8S_NAMESPACE }} \
            --sort-by='.lastTimestamp' | tail -30
          echo "=== Pod status ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide
