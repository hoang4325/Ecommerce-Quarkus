server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json
        application/javascript text/javascript
        image/svg+xml application/xml;
    gzip_min_length 256;

    # ── React SPA routing ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # No-cache for index.html so new deploys take effect immediately
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── API proxy → api-gateway ───────────────────────────────────────────────
    # TODO: Update upstream to match your Kubernetes Service name
    location /api/ {
        proxy_pass http://api-gateway-service:8083;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_buffering off;
    }

    # ── Hashed static assets — very long cache ────────────────────────────────
    # Vite adds content-hash to filenames (e.g. main.3f7a1b2c.js)
    location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 6M;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Hide nginx version ────────────────────────────────────────────────────
    server_tokens off;

    # ── Favicon silence ───────────────────────────────────────────────────────
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
